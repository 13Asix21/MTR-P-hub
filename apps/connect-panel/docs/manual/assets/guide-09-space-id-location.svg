<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330">
  <rect width="1100" height="330" fill="#ffffff"/>
  <text x="40" y="52" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#175d52">乐享知识库页面 · 地址栏里的 ID 在哪里</text>
  <text x="40" y="84" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6b7570">打开知识库后，浏览器顶部地址栏中的 32 位字符就是知识库 ID</text>

  <!-- 浏览器窗口 -->
  <rect x="40" y="110" width="1020" height="70" rx="10" fill="#f3f6f4" stroke="#d7ded8"/>
  <circle cx="70" cy="145" r="6" fill="#c7524a"/>
  <circle cx="92" cy="145" r="6" fill="#e0b341"/>
  <circle cx="114" cy="145" r="6" fill="#6cae7f"/>

  <!-- 地址栏 -->
  <rect x="140" y="126" width="890" height="38" rx="19" fill="#ffffff" stroke="#c9d3ce"/>
  <text x="164" y="151" font-family="Consolas, monospace" font-size="16" fill="#3f4a45">https://lexiang.tencent.com/space/</text>
  <rect x="470" y="130" width="470" height="30" rx="6" fill="#fdf3d9" stroke="#e0b341"/>
  <text x="482" y="151" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#8a5a12">bda1340e5541477d9698d82dc9a4b451</text>

  <!-- 标注箭头 -->
  <line x1="705" y1="196" x2="705" y2="238" stroke="#175d52" stroke-width="2"/>
  <polygon points="705,246 699,236 711,236" fill="#175d52"/>
  <rect x="500" y="250" width="410" height="46" rx="8" fill="#e2f2ea" stroke="#175d52"/>
  <text x="520" y="279" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#14544a">这 32 位字符 = 知识库 ID → 粘贴到设置页</text>

  <text x="40" y="302" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6b7570">提示：也可以整条复制地址栏链接，粘贴到设置页的「不知道知识库 ID？粘贴链接自动识别」里，点一下自动填入。</text>
</svg>
